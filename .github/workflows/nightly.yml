name: nightly-hardening

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  deep-fuzz:
    name: property + chaos (high volume)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,live]"
      - name: Property + chaos sweep
        env:
          HYPOTHESIS_PROFILE: nightly
        run: pytest -q -m "property or chaos"

  mutation:
    name: mutation testing (mutmut)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,live]"
      - name: Run mutmut
        run: mutmut run
      - name: Mutation results
        if: always()
        run: mutmut results
        
