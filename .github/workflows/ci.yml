name: CI

on:
  pull_request:
    branches: [donkey-kong-sandbox, main]
  push:
    branches: [donkey-kong-sandbox, main]

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the guard scans commit messages in base..HEAD
      - name: No automated-authorship markers
        run: bash scripts/governance/check_no_attribution.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,live]"
      - name: Run tests
        run: pytest -q

  compat-schema-gate:
    name: compat-schema-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect committed schema cache
        id: cache
        run: |
          if [ -f dbt_diagnostics/fixtures/schemas/manifest/v12.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No committed schema cache yet (issue #40); skipping schema diff."
          fi
      - name: Set up Python
        if: steps.cache.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        if: steps.cache.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Diff consumed paths across manifest schema versions
        if: steps.cache.outputs.present == 'true'
        run: |
          set -e
          for v in 4 5 6 7 8 9 10 11; do
            n=$((v + 1))
            base="dbt_diagnostics/fixtures/schemas/manifest/v${v}.json"
            new="dbt_diagnostics/fixtures/schemas/manifest/v${n}.json"
            if [ -f "$base" ] && [ -f "$new" ]; then
              python scripts/compat/schema_diff.py "$base" "$new" --artifact manifest
            fi
          done
      - name: Diff consumed paths across run-results schema versions
        if: steps.cache.outputs.present == 'true'
        run: |
          set -e
          for v in 4 5; do
            n=$((v + 1))
            base="dbt_diagnostics/fixtures/schemas/run-results/v${v}.json"
            new="dbt_diagnostics/fixtures/schemas/run-results/v${n}.json"
            if [ -f "$base" ] && [ -f "$new" ]; then
              python scripts/compat/schema_diff.py "$base" "$new" --artifact run-results
            fi
          done
      - name: Confirm single-version schema cache (catalog v1, sources v3)
        if: steps.cache.outputs.present == 'true'
        run: |
          set -e
          # catalog/sources have a single cached major (no adjacent pair to diff),
          # so assert the cache is present and self-consistent against itself.
          for spec in "catalog/v1" "sources/v3"; do
            f="dbt_diagnostics/fixtures/schemas/${spec}.json"
            artifact="${spec%%/*}"
            if [ -f "$f" ]; then
              python scripts/compat/schema_diff.py "$f" "$f" --artifact "$artifact"
            else
              echo "Missing cached schema $f (run scripts/compat/fetch_schemas.py); failing."
              exit 1
            fi
          done
