[project]
name = "dbt-diagnostics"
version = "0.5.0"
description = "Lineage-aware error tracer for dbt projects on Snowflake. Snowflake-only: non-Snowflake errors will be classified as 'unknown'."
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=26.0,<28.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
live = [
    "snowflake-connector-python>=3.7.0",
    "cryptography>=41.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.0",
]

[project.scripts]
dbt-diagnostics = "dbt_diagnostics.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt_diagnostics*"]

[tool.setuptools.package-data]
dbt_diagnostics = [
    "templates/**/*.j2",
    "fixtures/*.json",
    # First-party dbt artifact schema cache (issue #40): committed so the
    # compat schema-diff gate runs fully offline. Shipped with the package so
    # the cache is available wherever the package is installed.
    "fixtures/schemas/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["dbt_diagnostics/tests", "scripts/triage"]
markers = [
    "unit: fast, isolated unit tests (default tier, runs on every PR)",
    "contract: assert artifact parsing/classification against golden fixtures",
    "property: Hypothesis property-based tests over generated artifacts",
    "robustness: malformed/adversarial artifacts must degrade, not crash",
    "e2e: end-to-end CLI runs including --json schema validation",
    "chaos: seeded failure-injection over real golden artifacts (nightly volume)",
    "live: requires a real Snowflake connection (skipped unless creds present)",
]
addopts = "--strict-markers"
