[project]
name = "dbt-diagnostics"
version = "0.5.0"
description = "Lineage-aware error tracer for dbt projects on Snowflake. Snowflake-only: non-Snowflake errors will be classified as 'unknown'."
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=26.0,<28.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
live = [
    "snowflake-connector-python>=3.7.0",
    "cryptography>=41.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "mutmut>=3.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Only the fixture-capture generator needs a real dbt install. Kept separate
# from `dev` so PR CI does not pull dbt for the offline test suite.
fixtures = [
    "dbt-core>=1.11,<1.12",
    "dbt-snowflake>=1.11,<1.12",
]

[project.scripts]
dbt-diagnostics = "dbt_diagnostics.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt_diagnostics*"]

[tool.setuptools.package-data]
dbt_diagnostics = ["templates/**/*.j2", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["dbt_diagnostics/tests"]
markers = [
    "unit: fast, isolated unit tests (default tier, runs on every PR)",
    "contract: assert artifact parsing/classification against golden fixtures",
    "property: Hypothesis property-based tests over generated artifacts",
    "robustness: malformed/adversarial artifacts must degrade, not crash",
    "e2e: end-to-end CLI runs including --json schema validation",
    "chaos: seeded failure-injection over real golden artifacts (nightly volume)",
    "live: requires a real Snowflake connection (skipped unless creds present)",
]
# Property/chaos tiers are opt-in by volume: PR CI runs a bounded profile,
# the nightly job runs the extended one (see .github/workflows).
addopts = "--strict-markers"

[tool.coverage.run]
source = ["dbt_diagnostics"]
omit = ["dbt_diagnostics/tests/*", "dbt_diagnostics/fixtures/*"]
branch = true

[tool.coverage.report]
# Floor = the measured baseline (offline tiers ~78%). Ratchet up over time;
# never down. Keep in sync with the CI gate.
fail_under = 77
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dbt_diagnostics/fixtures", "fixtures_src"]

[tool.ruff.lint]
# Python code-quality only. This is NOT static SQL linting (see AGENTS.md scope
# guard): no rules here inspect dbt models or SQL.
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["dbt_diagnostics/tests/", "fixtures_src/"]

[tool.mutmut]
# Mutation testing: mutate the diagnosis core (the logic the suite must "kill")
# and run the fast offline tiers against each mutant. Runs in the nightly job,
# not on every PR. A surviving mutant means a test asserts too little.
paths_to_mutate = [
    "dbt_diagnostics/classifiers/",
    "dbt_diagnostics/tracers/",
    "dbt_diagnostics/root_cause.py",
    "dbt_diagnostics/schema_version.py",
]
tests_dir = "dbt_diagnostics/tests/"
# Keep mutant runs fast and hermetic: skip live/Snowflake and high-volume tiers.
runner = "python -m pytest -x -q -m 'not live and not chaos' -p no:cacheprovider"
